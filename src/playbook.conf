            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Three AC-only latency extras from the Insane gaming layer. Originals are saved under %LOCALAPPDATA%\AstraMax\Backups and can be restored from Restore.ps1. Dynamic tick writes a BCD setting and needs a reboot; benchmark before keeping it.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off PCIe link power saving (AC only)</Text>
                    <Name>pcie-aspm</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable the disk idle timeout (AC only)</Text>
                    <Name>disk-idle</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable the kernel dynamic tick (experimental, reboot)</Text>
                    <Name>dynamic-tick</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Gaming shell extras, off by default. Toast pop-ups, the menu show delay and the accessibility shortcut keys are all per-user and reversible from Restore.ps1 -QoL. Do not turn off the accessibility shortcuts on a machine where someone relies on Sticky Keys or Toggle Keys.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off notification pop-ups</Text>
                    <Name>tweak-toasts</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove the menu show delay (0 ms)</Text>
                    <Name>tweak-menu-delay</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off accessibility shortcut keys</Text>
                    <Name>tweak-a11y-keys</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Two more shell strips from the gaming layer, off by default. Both are reversible from Restore.ps1 -QoL. Hiding the Ink button is cosmetic; the Edge policies only hide the sidebar, shopping, widgets and first-run screens, they do not touch the browser engine games use for WebView2.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Hide the Windows Ink Workspace button</Text>
                    <Name>tweak-ink-button</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Edge gaming policies (sidebar, shopping, widgets off)</Text>
                    <Name>tweak-edge-gaming</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off Game Bar startup tips</Text>
                    <Name>tweak-gamebar-tips</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Taskbar End task on Windows 11 23H2 or newer. Right-click a running application to terminate it without opening Task Manager. Unsaved work can be lost.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Enable the taskbar End task option</Text>
                    <Name>qol-end-task</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Security hardening, on by default. Turns SmartScreen on (Warn) with the policy enabled, disables LLMNR multicast name resolution and disables AutoPlay/AutoRun for every drive type. Previous values are saved under ProgramData\AstraMax\Security. Reversible from Restore.ps1 -Security.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Turn SmartScreen checks on</Text>
                    <Name>harden-smartscreen</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Turn off LLMNR name resolution</Text>
                    <Name>harden-llmnr</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Turn off AutoRun for all drives</Text>
                    <Name>harden-autorun</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Disable security extras, off by default and a security trade-off. Turning SmartScreen off removes the checks and the policy; turning Security Center alerts off hides the Defender/Security toast notifications. If the hardening page above is also ticked, this page runs later and wins. Reversible from Restore.ps1 -Security.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Turn SmartScreen off</Text>
                    <Name>sec-smartscreen-off</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off Security Center toast alerts</Text>
                    <Name>sec-security-notifications-off</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>


        <RadioPage IsRequired="true" DefaultOption="disable-defender" Description="Windows Defender real-time protection.">
            <TopLine Text="Disabled by default in this build. Keeping Defender on is the safer choice; disabling it is a security trade-off."/>
            <Options>
                <RadioOption>
                    <Text>Keep Defender enabled (scan throttling only)</Text>
                    <Name>enable-defender</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable Defender real-time protection</Text>
                    <Name>disable-defender</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <RadioPage IsRequired="true" DefaultOption="disable-vbs" Description="Virtualization-Based Security.">
            <TopLine Text="Disabled by default (hypervisor, memory integrity and Credential Guard off). VBS off can improve game performance but breaks kernel anti-cheats such as Vanguard and FACEIT."/>
            <Options>
                <RadioOption>
                    <Text>Keep VBS enabled (required by some anti-cheats)</Text>
                    <Name>enable-vbs</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable VBS (performance mode, no Vanguard/FACEIT)</Text>
                    <Name>disable-vbs</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <CheckboxPage Description="Capture, display and network toggles ported from the Astra app, off by default. Game DVR stops background recording (manual Game Bar captures still work). Fullscreen optimizations off forces exclusive fullscreen; some overlays and alt-tab behaviour change. MPO off fixes flicker on some GPUs but can cost a little desktop smoothness and needs a sign-out. Releasing QoS reserved bandwidth removes the policy limit. Every value Astra writes is reproduced exactly and undone by Restore.ps1 -QoL.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off Xbox Game DVR background recording</Text>
                    <Name>extra-game-dvr-off</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off fullscreen optimizations globally</Text>
                    <Name>extra-fso-off</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable the multiplane overlay (MPO)</Text>
                    <Name>extra-mpo-off</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Release QoS reserved bandwidth</Text>
                    <Name>extra-qos-off</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Start search and shell toggles, off by default. Keeping search local stops Bing web results; turning cloud search off stops Microsoft-account and work-account suggestions. Both make Start search lighter without touching the local index. Recall off blocks snapshots on Copilot+ PCs (no effect elsewhere). Hiding the Widgets button removes it from the taskbar. Reversible from Restore.ps1 -QoL.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Keep Start search local (no Bing web results)</Text>
                    <Name>extra-search-local</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off Start cloud search suggestions</Text>
                    <Name>extra-cloud-search-off</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off Recall snapshots (Copilot+ PCs)</Text>
                    <Name>extra-recall-off</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Hide the Widgets button</Text>
                    <Name>extra-widgets-off</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="StartAllBack is a paid third-party Start menu and taskbar add-on with a per-user license (startallback.com). Ticking this downloads the official signed setup from startallback.com, installs it silently and adds an install shortcut to the desktop and Start menu. If the download or signature check fails, the shortcut opens the official page. Astra never redistributes the installer and does not cover StartAllBack in Restore.ps1. It changes the shell, not the search index: use the search options above to lighten Start search itself.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>StartAllBack — download and install the official setup (paid add-on)</Text>
                    <Name>install-startallback</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Reviewed EXM Windows settings, optional and reversible from Astra Toolbox or Restore.ps1 -Toolbox. Search history collection off does not erase existing history; silent notifications keep banners; automatic restart sign-on off may defer update setup until you sign in manually. These settings require the bundled .NET Desktop Runtime 8 when applied.">
            <TopLine Text="These are privacy and convenience choices, not promised FPS gains. The original batch is never executed; UAC and exploit mitigations are not weakened by these additions."/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Do not collect device search history</Text>
                    <Name>exm-search-history</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Silent notifications (keep banners)</Text>
                    <Name>exm-notification-sound</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable automatic restart sign-on</Text>
                    <Name>exm-restart-sign-on</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Reviewed EXM Chrome and wallpaper settings, all optional. Chrome background apps off stops background extensions after the last window closes; online spelling off keeps local spellcheck; location blocked breaks location-dependent websites. Restart Chrome and check chrome://policy. JPEG wallpaper quality 100 affects JPEG import only, not FPS. Original registry values are saved by the toolbox engine for exact restore; the bundled .NET Desktop Runtime 8 is required.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Stop Chrome background apps after closing Chrome</Text>
                    <Name>exm-chrome-background</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Chrome online spellcheck (keep local)</Text>
                    <Name>exm-chrome-spelling</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Block Chrome website location by default</Text>
                    <Name>exm-chrome-location</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>JPEG wallpaper import quality 100</Text>
                    <Name>exm-wallpaper-quality</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Optional Windows sign-in and Start preferences. Skip first-sign-in animation only affects new accounts and also suppresses Microsoft-account service opt-in prompts; hiding account details is not anonymity; hiding Recently added keeps applications installed. Policies may be ignored on Home or overridden by organization policy. Original values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Skip the first-sign-in animation</Text><Name>sys-first-signin-animation-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Hide additional account details at sign-in</Text><Name>sys-signin-account-details-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Hide recently installed apps in Start (restart required)</Text><Name>sys-start-recent-apps-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Windows-app privacy restrictions. Account-information and contacts access are denied by default, which can break identity, personalization or contacts features. Per-app exceptions take precedence and arbitrary desktop programs are not universally covered. Pro, Enterprise, Education and IoT policies may be ignored on Home; organization policy can override them. Restart affected apps; original values can be restored inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app account-information access</Text><Name>sys-app-account-info-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app contacts access</Text><Name>sys-app-contacts-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Chrome privacy and notification choices. Online search suggestions off retains local history and bookmarks; speculative connections off may slow websites; blocking third-party cookies can break embedded sign-in; website alerts may be unavailable when notifications are blocked. Restart Chrome and check chrome://policy for acceptance. Existing site exceptions may still matter. Windows notifications and browser security checks remain unchanged; original registry values are saved.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Disable Chrome online search suggestions</Text><Name>chrome-search-suggestions-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Disable Chrome speculative connections</Text><Name>chrome-network-prediction-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Block Chrome third-party cookies</Text><Name>chrome-third-party-cookies-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Block Chrome website notifications by default</Text><Name>chrome-website-notifications-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Chrome features and memory preferences. Translation off removes the feature, not just prompts; asking where to save adds a dialog to every download; Google Cast off removes casting and requires restarting Chrome; Memory Saver discards eligible inactive tabs, which may reload when revisited (Chrome 108 or newer). Check chrome://policy for acceptance; Chrome may show managed settings. These are preferences, not guaranteed FPS gains, and their original registry values can be restored.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Disable Chrome built-in translation</Text><Name>chrome-translation-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Ask where to save Chrome downloads</Text><Name>chrome-download-location-prompt</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Disable Google Cast in Chrome</Text><Name>chrome-cast-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Enable Chrome Memory Saver</Text><Name>chrome-memory-saver-on</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Chrome Energy Saver (Chrome 108 or newer). Activates on low battery and throttles browser frame rate to reduce power consumption; this is not a desktop-performance boost. Refresh Chrome policy or restart, and check chrome://policy for acceptance. Chrome may show managed settings. Original registry values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Enable Chrome Energy Saver at low battery</Text><Name>chrome-low-battery-saver-on</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Windows Settings, Store and message preferences. Online tips off reduces online Settings help, not promotional tips; reopen Settings. Remote Store installation off keeps local installs and updates. Message cloud backup off only affects the applicable cellular-message feature, not general Phone Link, email or messaging. Pro, Enterprise, Education and IoT policies may be ignored on Home or overridden by organization policy. Original values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Disable online tips in Windows Settings</Text><Name>exm-settings-online-tips-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Block remote Microsoft Store app installation</Text><Name>exm-store-push-install-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Disable cellular-message cloud backup and restore</Text><Name>exm-message-cloud-sync-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Chrome website device permissions, blocked by default when selected. Sensor-dependent sites and browser serial, Bluetooth or USB workflows can break; applicable site-policy exceptions may override defaults. Normal Windows sensors, COM ports, Bluetooth, headsets and USB hardware remain enabled. Minimum Chrome versions: sensors 88, Serial 86, Bluetooth 50, WebUSB 67. Restart Chrome and check chrome://policy for acceptance; Chrome may show managed settings. Original values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Block Chrome website sensor access by default</Text><Name>exm-chrome-sensors-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Block Chrome Web Serial requests by default</Text><Name>exm-chrome-serial-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Block Chrome Web Bluetooth requests by default</Text><Name>exm-chrome-bluetooth-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Block Chrome WebUSB requests by default</Text><Name>exm-chrome-webusb-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Chrome feedback and spelling preferences. Report an Issue off (Chrome 77+) removes the command and shortcut, not all browser metrics. All spellchecking off (Chrome 65+) loses local dictionaries, spelling suggestions and related accessibility assistance; choose the earlier online-only spellcheck option to keep local checking. Restart Chrome and check chrome://policy for acceptance; Chrome may show managed settings. No gaming gain is promised. Original values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Hide Chrome's Report an Issue command</Text><Name>exm-chrome-feedback-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Disable all Chrome spellchecking (including local)</Text><Name>exm-chrome-spellchecking-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Windows-app personal-data permissions, denied by default when selected. Calendar, mail, text/MMS and calling integrations can fail; existing calendar data and mail are not deleted and phone hardware stays enabled. These are AppPrivacy defaults, not direct ConsentStore edits; per-app policy exceptions override defaults and arbitrary Win32 apps are not universally covered. The corresponding user choices are locked while configured. Pro, Enterprise, Education and IoT policies may be ignored on Home or overridden by organization policy. Restart affected apps; original values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app calendar access by default</Text><Name>exm-app-calendar-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app email access by default</Text><Name>exm-app-email-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app text/MMS reading and sending by default</Text><Name>exm-app-messaging-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app phone-call access by default</Text><Name>exm-app-phone-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Windows-app diagnostic, history, task and notification access restrictions. Other-app diagnostic, call-history, task-list and notification-reading integrations can fail. These do not disable Windows telemetry, error reporting, diagnostic services, scheduled tasks or ordinary notification banners/sounds; history and task lists are not erased. AppPrivacy defaults lock the corresponding user choices; per-app policy exceptions override defaults and arbitrary Win32 apps are not universally covered. Pro, Enterprise, Education and IoT policies may be ignored on Home or overridden by organization policy. Restart affected apps; original values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app access to other-app diagnostics</Text><Name>exm-app-diagnostics-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app call-history access by default</Text><Name>exm-app-call-history-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app task-data access by default</Text><Name>exm-app-tasks-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app notification-reading access</Text><Name>exm-app-notification-reading-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Optional Windows-app device and motion permissions. Radio-control, unpaired wireless-device and motion-dependent integrations can fail; Wi-Fi/Bluetooth drivers and normal hardware stay enabled. Unpaired-device communication is not a trusted-devices policy. Motion access is a documented extra, not a proven equivalent of EXM's activity entry or Windows Activity History suppression. AppPrivacy defaults lock the corresponding user choices; per-app policy exceptions override defaults and arbitrary Win32 apps are not universally covered. Pro, Enterprise, Education and IoT policies may be ignored on Home or overridden by organization policy. Restart affected apps; original values are saved for restore inside Astra System.">
            <Options>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app control of radios</Text><Name>exm-app-radio-control-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app unpaired-device communication</Text><Name>exm-app-unpaired-device-sync-off</Name></CheckboxOption>
                <CheckboxOption IsChecked="false"><Text>Deny Windows-app motion-data access (documented extra)</Text><Name>sys-app-motion-off</Name></CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
