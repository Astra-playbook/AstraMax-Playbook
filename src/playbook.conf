        <CheckboxPage IsRequired="true" Description="NVIDIA recovery helpers. The NVIDIA Control Panel ships as a Store app and the Store is removed at Extreme, so it cannot be installed from there afterwards. Ticking this adds desktop and Start Menu shortcuts to the official NVIDIA App page and driver download page; installing a driver from nvidia.com restores the Control Panel without the Store, and the NVIDIA App is a normal desktop installer. NVIDIA packages are always excluded from app debloat and no NVIDIA installer is bundled or downloaded automatically. NvidiaTools.ps1 diagnoses the Control Panel, the NVIDIA App, the Store, winget, Windows Update and BITS later, names exactly what is missing, and installs the Control Panel from the Microsoft Store with winget when the Store and its services are healthy (falling back to exact wsreset/winget/driver steps).">
