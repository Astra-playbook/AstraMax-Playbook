                <RadioOption>
                    <Text>Quad9 — 9.9.9.9, 149.112.112.112</Text>
                    <Name>dns-quad9</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <CheckboxPage IsRequired="true" Description="DNS over HTTPS (Windows 11).">
