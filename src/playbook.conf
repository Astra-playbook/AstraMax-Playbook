<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>Astra</Name>
    <Username>astra</Username>
    <ShortDescription>Windows 11 gaming playbook with the Astra app</ShortDescription>
    <Title>Astra Playbook for Windows 11</Title>
    <Description>Gaming-focused playbook for AME Wizard Beta. Applies a Light, Recommended, Extreme or Insane tweak preset, removes preinstalled Windows apps at a Light, Moderate or Extreme debloat tier, sets Windows services to a Light, Moderate or Extreme (Caution) tier with an optional Insane process-diet strip, configures core parking, interrupt handling, network stack and DNS, applies per-game Siege and Fortnite profiles, deploys the new Gojo-themed Astra Toolbox with all 228 original tweaks plus 38 reviewed additions (266 total), a frosted-glass/acrylic UI, detailed System information and improvement checks, one-click Windows restore points, original-value backups, power presets, cleaner and a nine-image wallpaper gallery, bundles the runtimes most games need offline (DirectX June 2010, Visual C++ 2005-2022, .NET Desktop Runtime 8), adds quality-of-life, shell and latency tweaks including the Insane gaming strip, adds the Astra app's capture, display and search extras (Game DVR, fullscreen optimizations, MPO, QoS, local-only search, cloud search, Recall, Widgets), can download and install the paid StartAllBack add-on from startallback.com, and sets the bundled Gojo wallpaper by default or keeps the current background.</Description>
    <Details>Preset-based Windows 11 tuning, a four-tier app debloat with an Insane gaming strip, an independent four-tier service tier plus an Insane per-user and service-host process diet, new Gojo Astra Toolbox with 266 tweaks, detailed System inventory, practical improvement checks, Windows restore points and saved original-value backups, a nine-image wallpaper pack, bundled DirectX, Visual C++ and .NET installers, optional Explorer, taskbar, latency, gaming-shell, capture, display and search tweaks, and an optional StartAllBack install fetched from the vendor in a single playbook.</Details>
    <ProgressText>Astra is working through the stack: debloat, services, power, network, game profiles, runtimes, the Gojo toolbox and wallpapers. This is the long part. Keep the machine plugged in and do not power off.</ProgressText>
    <Version>1.0</Version>
    <UniqueId>bea20ebb-a254-46c2-ad6c-237fe95aaedc</UniqueId>

    <SupportedBuilds>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
        <string>26300</string>
    </SupportedBuilds>

    <Requirements>
        <Requirement>FreshInstall</Requirement>
        <Requirement>Internet</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>

    <SupportsISO>true</SupportsISO>
    <ISO>
        <DisableBitLocker>true</DisableBitLocker>
        <DisableHardwareRequirements>true</DisableHardwareRequirements>
    </ISO>

    <OOBE>
        <BulletPoints>
            <BulletPoint Icon="Rocket" Title="Presets"
            Description="Choose Light, Recommended, Extreme or Insane. Every tier includes the previous one, so you can step up without reapplying."/>
            <BulletPoint Icon="Lock" Title="Astra Tool"
            Description="Deploys the new Gojo Astra Toolbox with all original tweaks, exact-value restore and a wallpaper gallery."/>
            <BulletPoint Icon="Privacy" Title="Game Frameworks"
            Description="DirectX End-User Runtime, Visual C++ 2005-2022 All-in-One, and .NET runtimes for older and newer titles."/>
        </BulletPoints>
    </OOBE>

    <FeaturePages>
        <RadioPage IsRequired="true" DefaultOption="preset-recommended" Description="Choose how aggressively Astra tunes Windows. Tiers are cumulative: Recommended includes Light, Extreme includes Recommended, Insane includes Extreme.">
            <Options>
                <RadioOption>
                    <Text>Light — safe UI and input tweaks, no services touched</Text>
                    <Name>preset-light</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Recommended — gaming optimizations, telemetry and lookup services off</Text>
                    <Name>preset-recommended</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Extreme — maximum latency reduction, extra services and memory tweaks</Text>
                    <Name>preset-extreme</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Insane — Extreme plus Store, push, SMB and Teredo hardening; expect breakage</Text>
                    <Name>preset-insane</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <RadioPage IsRequired="true" DefaultOption="debloat-light" Description="Remove preinstalled Windows apps. Tiers are cumulative. Provisioned copies are removed for every account, so this is not a toggle: apps come back from the Store or winget, and Extreme removes the Store itself (restore with wsreset -i). Each removed package also loses its package-data folders and per-user AppModel registry keys; Extreme additionally cleans OneDrive install data and settings but never the user's synced files.">
            <Options>
                <RadioOption>
                    <Text>None — keep every preinstalled app</Text>
                    <Name>debloat-none</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Light — Clipchamp, news, weather, Bing search, Tips, Solitaire, People</Text>
                    <Name>debloat-light</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Moderate — Light plus Mail, Maps, Teams, Phone Link, Office hub, 3D/Print, Family, media and Alarms</Text>
                    <Name>debloat-moderate</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Extreme — Moderate plus Store, Photos, Camera, Xbox app, Copilot, OneDrive</Text>
                    <Name>debloat-extreme</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <CheckboxPage IsRequired="true" Description="INSANE APP STRIP (advanced). Adds the remaining non-gaming Microsoft apps on top of the selected tier: Calculator, Notepad, Snipping Tool, Paint, Sticky Notes, Get Help, OneNote, Wallet, Journal, Whiteboard, OneConnect, Raw Image Extension, Quick Assist, the Xbox speech overlay, Widgets and the web experience. This tier also removes 19 non-gaming Windows optional features (Fax, Work Folders, Simple TCP, Telnet, TFTP, SNMP, NFS, Remote Desktop client, SMB1, Windows Media Player and the printing extras). After each package is removed its per-user and shared package-data folders and per-user AppModel registry keys are deleted, so the app leaves no data behind. Edge, WebView2, media codecs, DirectX runtimes and Xbox identity/Game Services are kept because games and launchers need them. Choose this only for a nearly empty Windows that you can rebuild yourself.">
            <TopLine Text="WARNING: apps are NOT restorable automatically and their package data is deleted permanently. The Store is already gone at Extreme; the bundled winget stays protected so you can reinstall. Removed optional features can be re-enabled with Debloat.ps1 -Restore ; deleted app data is not restored. Leave this unticked unless you understand the trade-off."/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Strip the remaining apps (Insane — irreversible)</Text>
                    <Name>debloat-insane</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <RadioPage IsRequired="true" DefaultOption="svc-light" Description="Set Windows background services to Disabled. Tiers are cumulative and independent of the preset: Light stops only services games never use, Moderate adds telemetry and maintenance, Extreme (Caution) also stops search indexing, printing, notifications and Store delivery.">
            <Options>
                <RadioOption>
                    <Text>None — leave every service at its Windows default</Text>
                    <Name>svc-none</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Light — Maps, Fax, media sharing, telephony, Remote Registry, WAP push</Text>
                    <Name>svc-light</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Moderate — Light plus telemetry, Superfetch, error reporting, Insider, location</Text>
                    <Name>svc-moderate</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Extreme (Caution) — Moderate plus search index, print spooler, notifications, Store delivery, WinRM, ICS; search, printing and notifications stop</Text>
                    <Name>svc-extreme</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <CheckboxPage IsRequired="true" Description="INSANE PROCESS DIET (advanced). On top of the selected tier this disables Windows Update and BITS, Remote Desktop host, Xbox/Game Pass, biometrics (Windows Hello), camera frame server, smart cards, diagnostics, UPnP discovery, VPN dialing, update orchestration, time sync, Security Center reporting, LAN file sharing and the per-user service templates that run one process per signed-in account. It also raises the service-host split threshold so Windows merges service hosts after a reboot. Every service disabled by any tier also loses its cache and report folders (update download cache, BITS jobs, WER queues, search index, offline maps, diagnostics staging, print queue and notification database) and stale per-user service keys are deleted, so the service leaves no data behind; each removal is recorded.">
            <TopLine Text="WARNING: Windows Update, Remote Desktop, Xbox/Game Pass, fingerprint and camera features stop working; UPnP/VPN clients, LAN file sharing, time sync and Security Center reporting also stop. Re-enable the exact startup types from Debloat.ps1 -Restore; service-host grouping applies after a reboot. Service cache folders and stale per-user keys deleted by this tier are not restored. Do not use if you cannot troubleshoot a broken machine."/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Strip the remaining services (Insane — restorable from the snapshot)</Text>
                    <Name>svc-insane</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Install the new Gojo-themed Astra Toolbox and game runtimes. The toolbox replaces the old Astra Max interface and installer, retains all 228 original tweaks and their backups, and adds 38 reviewed settings for a total of 266. The frosted-glass/acrylic interface includes detailed System information, practical improvement checks and one-click Windows restore-point creation. It needs .NET Desktop Runtime 8 x64, installed from the bundled runtime if missing. The DirectX and Visual C++ installers are bundled for offline setup.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Astra Toolbox — Gojo UI, all tweaks and wallpaper gallery</Text>
                    <Name>install-astra-toolbox</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>DirectX End-User Runtime June 2010 (bundled)</Text>
                    <Name>install-directx</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Visual C++ 2005-2022 AIO, x86 + x64 (bundled)</Text>
                    <Name>install-vcredist</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Older and newer .NET runtimes. .NET Desktop Runtime 8 is bundled and installs offline; .NET Framework 3.5 uses the Windows source and may need Windows Update.">
            <TopLine Text="Both are safe to install and can be removed later from Windows Features."/>
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>.NET Framework 3.5 (older games)</Text>
                    <Name>install-netfx3</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>.NET Desktop Runtime 8 (bundled x64)</Text>
                    <Name>install-dotnet8</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="NVIDIA recovery helpers. The NVIDIA Control Panel ships as a Store app and the Store is removed at Extreme, so it cannot be installed from there afterwards. Ticking this adds desktop and Start Menu shortcuts to the official NVIDIA App page and driver download page; installing a driver from nvidia.com restores the Control Panel without the Store, and the NVIDIA App is a normal desktop installer. NVIDIA packages are always excluded from app debloat and no NVIDIA installer is bundled or downloaded automatically. NvidiaTools.ps1 diagnoses the Control Panel, the NVIDIA App, the Store, winget, Windows Update and BITS later, names exactly what is missing, and installs the Control Panel from the Microsoft Store with winget when the Store and its services are healthy (falling back to exact wsreset/winget/driver steps).">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Add NVIDIA app + Control Panel download shortcuts</Text>
                    <Name>install-nvidia-tools</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <RadioPage IsRequired="true" DefaultOption="irq-balanced" Description="CPU core parking and GPU/NIC interrupt handling. Balanced disables core parking and enables MSI interrupts where drivers support them. Aggressive also spreads interrupts; Pinned keeps them off core 0. Reboot required.">
            <Options>
                <RadioOption>
                    <Text>Leave Windows defaults</Text>
                    <Name>irq-auto</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Balanced — core parking off, MSI interrupts on</Text>
                    <Name>irq-balanced</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Aggressive — Balanced plus GPU/NIC interrupts spread across all cores</Text>
                    <Name>irq-aggressive</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Pinned — Balanced plus GPU/NIC interrupts kept off core 0</Text>
                    <Name>irq-pinned</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <RadioPage IsRequired="true" DefaultOption="net-balanced" Description="Network stack tuning.">
            <TopLine Text="Balanced trims background network noise and keeps TCP autotuning intact. Low latency also disables Nagle and legacy name resolution."/>
            <Options>
                <RadioOption>
                    <Text>Leave Windows defaults</Text>
                    <Name>net-default</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Balanced — WPAD off, throttling off, TCP defaults verified</Text>
                    <Name>net-balanced</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Low latency — Balanced plus Nagle/NetBIOS/LLMNR off</Text>
                    <Name>net-lowlatency</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <RadioPage IsRequired="true" DefaultOption="dns-dhcp" Description="DNS resolver for adapters with a default gateway. Static DNS is applied only to active adapters with a gateway. DHCP keeps your router's resolvers.">
            <Options>
                <RadioOption>
                    <Text>Use DHCP / automatic DNS</Text>
                    <Name>dns-dhcp</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Cloudflare — 1.1.1.1, 1.0.0.1</Text>
