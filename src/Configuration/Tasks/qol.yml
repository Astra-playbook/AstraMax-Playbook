    command: |
      & '.\QoL.ps1' -Animations On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-animations-off

  - !writeStatus: {status: 'Turning off notification pop-ups', option: tweak-toasts}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -Notifications On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-toasts

  - !writeStatus: {status: 'Setting the menu show delay to zero', option: tweak-menu-delay}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -MenuDelay On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-menu-delay

  - !writeStatus: {status: 'Turning off accessibility shortcut keys', option: tweak-a11y-keys}
