title: Quality of Life
description: Explorer, taskbar, clock and Start preferences, all reversible
actions:
  - !writeStatus: {status: 'Applying quality-of-life tweaks'}

  - !writeStatus: {status: 'Switching to the classic right-click menu', option: qol-classic-menu}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -ClassicMenu On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-classic-menu

  - !writeStatus: {status: 'Enabling long path support', option: qol-long-paths}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -LongPaths On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-long-paths

  - !writeStatus: {status: 'Showing seconds in the clock', option: qol-clock-seconds}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -ClockSeconds On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-clock-seconds

  - !writeStatus: {status: 'Making Explorer open This PC', option: qol-open-this-pc}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -OpenThisPC On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-open-this-pc

  - !writeStatus: {status: 'Switching to dark mode', option: qol-dark-mode}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -DarkMode On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-dark-mode

  - !writeStatus: {status: 'Hiding Start recommendations', option: qol-start-recommendations-off}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -StartRecommendations On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-start-recommendations-off

  - !writeStatus: {status: 'Enabling clipboard history', option: qol-clipboard-history}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -ClipboardHistory On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-clipboard-history

  - !writeStatus: {status: 'Aligning the taskbar to the left', option: qol-taskbar-left}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -TaskbarLeft On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: qol-taskbar-left

  - !writeStatus: {status: 'Enabling taskbar End task', option: qol-end-task}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -EndTask On
    exeDir: true
    runas: currentUserElevated
    wait: true
    option: qol-end-task

  - !writeStatus: {status: 'Stopping background apps', option: tweak-bg-apps}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -BackgroundApps On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-bg-apps

  - !writeStatus: {status: 'Raising foreground scheduling priority', option: tweak-priority-boost}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -PriorityBoost On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-priority-boost

  - !writeStatus: {status: 'Hiding sync provider notifications', option: tweak-sync-ads}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -SyncAds On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-sync-ads

  - !writeStatus: {status: 'Disabling Aero Shake', option: tweak-aero-shake}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -AeroShake On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-aero-shake

  - !writeStatus: {status: 'Turning off window and taskbar animations', option: qol-animations-off}
