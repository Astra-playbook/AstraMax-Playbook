  - !writeStatus: {status: 'Hiding the Windows Ink Workspace button', option: tweak-ink-button}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -InkWorkspace On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-ink-button

  - !writeStatus: {status: 'Applying Edge gaming policies', option: tweak-edge-gaming}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -EdgeGaming On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-edge-gaming

  - !writeStatus: {status: 'Turning off Game Bar startup tips', option: tweak-gamebar-tips}
  - !powerShell:
    command: |
      & '.\QoL.ps1' -GameBarTips On
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: tweak-gamebar-tips
