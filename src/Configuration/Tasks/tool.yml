title: Astra Max
description: Installs Astra Max from its bundled NSIS installer (silent)
actions:
  - !writeStatus: {status: 'Installing Astra', option: install-astra-max}
  # NSIS silent switch. If the installer is repacked with another toolchain,
  # change the args to match it (e.g. Inno Setup uses /VERYSILENT /SUPPRESSMSGBOXES).
  - !run:
    exe: 'Astra-Max-Setup.exe'
    args: '/S'
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: install-astra-max
