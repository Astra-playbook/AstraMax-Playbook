title: StartAllBack
description: Installs the optional StartAllBack setup when it is bundled and adds an install shortcut
actions:
  - !writeStatus: {status: 'Setting up StartAllBack', option: install-startallback}
  - !powerShell:
    command: |
      & '.\StartAllBack.ps1'
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: install-startallback
