title: Astra wallpaper pack
description: Copies the nine supplied wallpapers and applies only the selected wallpaper mode
actions:
  - !powerShell:
    command: |
      $gallery = Join-Path ([Environment]::GetFolderPath('MyPictures')) 'Astra\Wallpapers'
      New-Item -ItemType Directory -Path $gallery -Force | Out-Null
      Copy-Item -LiteralPath '.\Toolbox\Wallpapers' -Destination (Split-Path $gallery -Parent) -Recurse -Force
      "wallpapers: $gallery"
    exeDir: true
    runas: currentUserElevated
    wait: true

  - !powerShell:
    command: |
      & '.\Wallpaper.ps1' -Image '.\Toolbox\Wallpapers\gojo.png'
    exeDir: true
    runas: currentUserElevated
    wait: true
    option: wp-gojo

  - !powerShell:
    command: |
      & '.\PersonalWallpaper.ps1' -Mode On
    exeDir: true
    runas: currentUserElevated
    wait: true
    option: wp-personal-static

  - !powerShell:
    command: |
      & '.\PersonalWallpaper.ps1' -Live -Mode On
    exeDir: true
    runas: currentUserElevated
    wait: true
    option: wp-personal-live
