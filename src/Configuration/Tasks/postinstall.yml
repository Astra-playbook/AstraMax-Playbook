title: Post-install toolkit
description: Deploys the Astra post-install menu that can turn every tweak back on or off later
actions:
  - !writeStatus: {status: 'Deploying the post-install toolkit', option: postinstall-tool}
  - !powerShell:
    command: |
      $target = 'C:\AstraMax\PostInstall'
      New-Item -ItemType Directory -Path $target -Force | Out-Null
      Copy-Item -Path '.\PostInstall\*' -Destination $target -Recurse -Force
      foreach ($helper in 'QoL.ps1', 'Security.ps1', 'HardwareTweaks.ps1', 'GameProfiles.ps1', 'LaunchOptions.json', 'PersonalWallpaper.ps1', 'NvidiaTools.ps1') {
          Copy-Item -LiteralPath (Join-Path '.' $helper) -Destination 'C:\AstraMax' -Force
      }
      Copy-Item -LiteralPath '.\LiveWallpaper' -Destination 'C:\AstraMax' -Recurse -Force

      $assets = Join-Path $target 'Assets'
      New-Item -ItemType Directory -Path $assets -Force | Out-Null
      foreach ($img in 'Astra-Wallpaper.png', 'Astra-Wallpaper-RedPurple.png') {
          Copy-Item -LiteralPath (Join-Path '.' $img) -Destination $assets -Force
      }

      $cmd = Join-Path $target 'Astra-PostInstall.cmd'
      $app = Join-Path $target 'AstraMaxPostInstall.exe'
      $targetExe = if (Test-Path -LiteralPath $app) { $app } else { $cmd }
      $ws = New-Object -ComObject WScript.Shell

      $desktop = [Environment]::GetFolderPath('Desktop')
      $lnk = $ws.CreateShortcut((Join-Path $desktop 'Astra Post Install.lnk'))
      $lnk.TargetPath = $targetExe
      $lnk.WorkingDirectory = $target
      $lnk.IconLocation = 'shell32.dll,21'
      $lnk.Description = 'Astra - turn tweaks on or off after installation'
      $lnk.Save()

      $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'
      if (Test-Path -LiteralPath $startMenu) {
          $lnk2 = $ws.CreateShortcut((Join-Path $startMenu 'Astra Post Install.lnk'))
          $lnk2.TargetPath = $targetExe
          $lnk2.WorkingDirectory = $target
          $lnk2.IconLocation = 'shell32.dll,21'
          $lnk2.Description = 'Astra - turn tweaks on or off after installation'
          $lnk2.Save()
      }

      "post-install toolkit: $targetExe"
    exeDir: true
    runas: currentUserElevated
    wait: true
    ignoreErrors: true
    option: postinstall-tool
