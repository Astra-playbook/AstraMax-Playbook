title: Reviewed EXM settings
description: Applies selected settings through the toolbox's original-value backup engine, never executes the supplied batch
actions:
  - !powerShell:
    command: |
      & '.\Invoke-ToolboxTweak.ps1' -Id 'qol.search-history-off'
    exeDir: true
    runas: currentUserElevated
    wait: true
    option: exm-search-history

